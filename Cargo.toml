[package]
name        = "invbeertory"
version     = "0.1.0"
edition     = "2021"
description = "Simple beer inventory display"
readme      = "README.md"
authors     = ["Cian Butler <butlerx@notthe.cloud>"]
repository  = "https://github.com/butlerx/invbeertory"
license     = "MIT"
keywords    = [
  "beer",
  "display",
  "google-sheets",
  "inventory",
  "rust",
  "wasm",
  "web",
  "yew",
]
categories  = ["beer", "display", "inventory", "simple", "wasm", "web"]

[dependencies]
chrono               = "0.4"
csv                  = "1.1"
implicit-clone       = { version = "0.6", features = ["map", "serde"] }
js-sys               = "0.3"
serde                = { version = "1", features = ["derive"] }
serde_json           = "1"
serde_repr           = "0.1"
serde-wasm-bindgen   = "0.6"
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
web-sys              = { version = "0.3", features = ["HtmlDivElement", "SvgsvgElement"] }
yew                  = { version = "0.23", features = ["csr"] }
yew-router           = "0.20"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[lints.rust]
unsafe_code = "deny"
